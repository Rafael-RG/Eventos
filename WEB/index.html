<script>
    function openInSafari(url) {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;

        // Verificar si es un dispositivo iOS
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            // Abrir directamente en Safari
            window.location.href = url; 
        } else {
            window.open(url, '_blank'); // Abrir en una nueva pestaña para otros navegadores
        }
    }

    function downloadFile() {
        const urlParams = new URLSearchParams(window.location.search);
        const eventParam = urlParams.get('event');

        if (!eventParam) {
            console.error('El parámetro "event" no está presente en la URL.');
            return;
        }

        const fetchUrl = `https://recuerdame.azurewebsites.net/api/event?event=${eventParam}&code=Qjgv-L55Jc88E6FkBX73MhThSXtZJZLguUj2YtsW0Wb0AzFuoV2pug%3D%3D`;

        fetch(fetchUrl)
            .then(response => {
                if (response.status === 204) {
                    alert('El evento ya no está disponible.');
                    window.close();
                    return;
                }
                return response.text(); // Cambiado para obtener el string URL directamente
            })
            .then(data => {
                if (!data) return;

                // Aquí asumimos que 'data' es la URL que termina en .ics
                openInSafari(data); // Llamar a la función para abrir en Safari
            })
            .catch(error => {
                console.error('Error al descargar el archivo:', error);
            });
    }

    window.onload = downloadFile;
</script>
